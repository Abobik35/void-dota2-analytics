# Деплой VOID одним сервисом на Render (free tier): FastAPI раздаёт и API, и собранный фронтенд.
# Настройка: https://dashboard.render.com → New + → Blueprint → выбрать репозиторий.
services:
  - type: web
    name: void
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && (cd frontend && npm ci --no-audit --no-fund && npm run build) && cp -r frontend/dist backend/static
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Собранный фронтенд кладём в backend/static, сервер его раздаёт
      - key: FRONTEND_DIST
        value: static
      # После первого деплоя поменяй на фактический адрес сервиса (например https://void.onrender.com)
      # — от него зависит возврат после входа через Steam. Меняется в Dashboard → Environment.
      - key: PUBLIC_URL
        syncValue: false
      # Секрет для подписи сессий — генерируется автоматически
      - key: SECRET_KEY
        generateValue: true
      # Необязательно: ключ OpenDota повышает лимиты запросов (60/мин без него)
      - key: OPENDOTA_API_KEY
        syncValue: false
